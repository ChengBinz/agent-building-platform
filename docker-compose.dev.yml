services:
  nginx:
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

  backend:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      target: builder
    profiles: []
    environment:
      - VITE_API_TARGET=http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
