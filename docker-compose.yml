services:
  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:1.27-alpine
    container_name: agent-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - agent-net

  # ─── Backend API ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-backend
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-net

  # ─── MCP Servers ───
  mcp-weather:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: agent-mcp-weather
    command: uvicorn weather.server:app --host 0.0.0.0 --port 9100
    restart: unless-stopped
    networks:
      - agent-net

  mcp-timezone:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: agent-mcp-timezone
    command: uvicorn timezone.server:app --host 0.0.0.0 --port 9101
    restart: unless-stopped
    networks:
      - agent-net

  mcp-web-search:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: agent-mcp-web-search
    command: uvicorn web_search.server:app --host 0.0.0.0 --port 9102
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    restart: unless-stopped
    networks:
      - agent-net

  # ─── Frontend Builder ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-frontend
    volumes:
      - frontend_dist:/app/dist
    networks:
      - agent-net

  # ─── PostgreSQL ───
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent123}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-net

  # ─── Qdrant Vector DB ───
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_EXPOSE_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q passed <&3"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-net

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    restart: unless-stopped
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  upload_data:
  frontend_dist:
